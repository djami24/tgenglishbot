name: Ingliz tili darsini Telegramga yuborish

on:
  schedule:
    # Vaqtlar UTC bo'yicha. Toshkent = UTC+5.
    # 02:00 UTC -> 07:00 Toshkent
    # 09:00 UTC -> 14:00 Toshkent
    # 15:00 UTC -> 20:00 Toshkent
    - cron: '0 2 * * *'
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: {}   # "Run workflow" tugmasi orqali qo'lda ham ishga tushirish mumkin

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Darsni generatsiya qilib yuborish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python post_lesson.py
