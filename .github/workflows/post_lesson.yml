name: Ingliz tili postini Telegramga yuborish

on:
  schedule:
    # Vaqtlar UTC bo'yicha. Toshkent = UTC+5 (DST yo'q).
    # Har 30 daqiqada, 24 soat davomida (48 post/kun).
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      category:
        description: "Majburiy turkum (bo'sh qoldirsangiz navbat bo'yicha avtomatik tanlanadi)"
        required: false
        type: choice
        options:
          - ''
          - grammar
          - vocab
          - fact
          - advanced_grammar
          - ielts_tips
          - beginner_grammar
          - synonyms
          - listening_tips
          - reading_tips
          - cefr_tips
          - motivational_quotes
          - grammar_tests
          - topic_vocab

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Postni generatsiya qilib yuborish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_CATEGORY: ${{ github.event.inputs.category }}
        run: python post_lesson.py

      - name: Ishlatilgan mavzular ro'yxatini saqlash (used_topics.json)
        run: |
          if [ -n "$(git status --porcelain used_topics.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add used_topics.json
            git commit -m "chore: update used_topics.json [skip ci]"
            git push
          else
            echo "used_topics.json o'zgarmadi, commit qilinmadi."
          fi
