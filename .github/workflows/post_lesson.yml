name: Ingliz tili postini Telegramga yuborish

on:
  schedule:
    # Vaqtlar UTC bo'yicha. Toshkent = UTC+5 (DST yo'q).
    # Har kuni 09:00 dan 18:00 gacha (Toshkent), har soatda 1 marta, jami 10 marta.
    # 04:00 UTC -> 09:00 Toshkent
    # 05:00 UTC -> 10:00 Toshkent
    # 06:00 UTC -> 11:00 Toshkent
    # 07:00 UTC -> 12:00 Toshkent
    # 08:00 UTC -> 13:00 Toshkent
    # 09:00 UTC -> 14:00 Toshkent
    # 10:00 UTC -> 15:00 Toshkent
    # 11:00 UTC -> 16:00 Toshkent
    # 12:00 UTC -> 17:00 Toshkent
    # 13:00 UTC -> 18:00 Toshkent
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: "Majburiy turkum (bo'sh qoldirsangiz navbat bo'yicha avtomatik tanlanadi)"
        required: false
        type: choice
        options:
          - ''
          - grammar
          - vocab
          - fact
          - advanced_grammar
          - ielts_tips
          - beginner_grammar
          - synonyms
          - listening_tips
          - reading_tips
          - cefr_tips
          - motivational_quotes
          - grammar_tests
          - topic_vocab

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Postni generatsiya qilib yuborish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_CATEGORY: ${{ github.event.inputs.category }}
        run: python post_lesson.py

      - name: Ishlatilgan mavzular ro'yxatini saqlash (used_topics.json)
        run: |
          if [ -n "$(git status --porcelain used_topics.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add used_topics.json
            git commit -m "chore: update used_topics.json [skip ci]"
            git push
          else
            echo "used_topics.json o'zgarmadi, commit qilinmadi."
          fi
