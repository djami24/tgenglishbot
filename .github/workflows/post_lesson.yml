name: Ingliz tili postini Telegramga yuborish

on:
  schedule:
    # Barcha vaqtlar UTC bo'yicha. Toshkent = UTC+5 (DST yo'q).

    # MAVZUGA OID LUG'AT (topic_vocab) - kuniga 2 marta: 09:00 va 19:00
    # Toshkent vaqti (= 04:00 va 14:00 UTC).
    - cron: '0 4 * * *'
    - cron: '0 14 * * *'

    # KUNLIK GRAMMAR SERIYASI (grammar) - kuniga 5 marta:
    # 14:00, 15:00, 16:00, 17:00, 18:00 Toshkent vaqti
    # (= 09:00, 10:00, 11:00, 12:00, 13:00 UTC).
    # ESLATMA: Grammar postlari endi tushdan keyin (14:00-18:00 Toshkent).
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'

    # "BILASIZMI?" (fun_fact) - kuniga 1 marta: 10:00 Toshkent vaqti
    # (= 05:00 UTC).
    - cron: '0 5 * * *'

    # SPEAKING PART 1 mashqi (speaking_part1) - kuniga 1 marta: 12:00
    # Toshkent vaqti (= 07:00 UTC).
    - cron: '0 7 * * *'

    # KUNLIK SO'ZLAR (daily_words) - kuniga 1 marta: 08:00 Toshkent vaqti
    # (= 03:00 UTC).
    - cron: '0 3 * * *'

    # PHRASAL VERBS (phrasal_verbs) - haftada 3 marta (Du, Chor, Jum):
    # 11:00 Toshkent vaqti (= 06:00 UTC).
    - cron: '0 6 * * 1,3,5'

    # IDIOMALAR (idioms) - haftada 3 marta (Se, Pay, Shan):
    # 11:00 Toshkent vaqti (= 06:00 UTC).
    - cron: '0 6 * * 2,4,6'

  workflow_dispatch:
    inputs:
      category:
        description: "Majburiy turkum (bo'sh qoldirsangiz grammar deb olinadi)"
        required: false
        type: choice
        options:
          - ''
          - grammar
          - topic_vocab
          - fun_fact
          - speaking_part1
          - daily_words
          - phrasal_verbs
          - idioms

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Turkumni cron vaqtiga qarab aniqlash
        id: category
        run: |
          case "${{ github.event.schedule }}" in
            "0 4 * * *"|"0 14 * * *")
              echo "value=topic_vocab" >> "$GITHUB_OUTPUT" ;;
            "0 9 * * *"|"0 10 * * *"|"0 11 * * *"|"0 12 * * *"|"0 13 * * *")
              echo "value=grammar" >> "$GITHUB_OUTPUT" ;;
            "0 5 * * *")
              echo "value=fun_fact" >> "$GITHUB_OUTPUT" ;;
            "0 7 * * *")
              echo "value=speaking_part1" >> "$GITHUB_OUTPUT" ;;
            "0 3 * * *")
              echo "value=daily_words" >> "$GITHUB_OUTPUT" ;;
            "0 6 * * 1,3,5")
              echo "value=phrasal_verbs" >> "$GITHUB_OUTPUT" ;;
            "0 6 * * 2,4,6")
              echo "value=idioms" >> "$GITHUB_OUTPUT" ;;
            *)
              # Qo'lda ishga tushirilgan run (workflow_dispatch) - agar
              # turkum tanlangan bo'lsa o'shani, aks holda "grammar".
              cat="${{ github.event.inputs.category }}"
              echo "value=${cat:-grammar}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Postni generatsiya qilib yuborish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          POST_CATEGORY: ${{ steps.category.outputs.value }}
        run: python post_lesson.py

      - name: Ishlatilgan mavzular ro'yxatini saqlash (used_topics.json)
        run: |
          if [ -n "$(git status --porcelain used_topics.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add used_topics.json
            git commit -m "chore: update used_topics.json [skip ci]"
            git push
          else
            echo "used_topics.json o'zgarmadi, commit qilinmadi."
          fi
