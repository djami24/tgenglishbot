name: Ingliz tili postini Telegramga yuborish

on:
  schedule:
    # Vaqtlar UTC bo'yicha. Toshkent = UTC+5.
    # Har bir vaqt post_lesson.py'dagi SCHEDULE_BY_HOUR bilan mos:
    # 02:00 UTC -> 07:00 Toshkent -> Grammar
    # 06:00 UTC -> 11:00 Toshkent -> Lug'at (vocab)
    # 09:00 UTC -> 14:00 Toshkent -> Qiziqarli fakt
    # 12:00 UTC -> 17:00 Toshkent -> Grammar
    # 15:00 UTC -> 20:00 Toshkent -> Tip
    - cron: '0 2 * * *'
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: "Majburiy turkum (bo'sh qoldirsangiz vaqtga qarab avtomatik tanlanadi)"
        required: false
        type: choice
        options:
          - ''
          - grammar
          - vocab
          - fact
          - tip

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Postni generatsiya qilib yuborish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POST_CATEGORY: ${{ github.event.inputs.category }}
        run: python post_lesson.py
